    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0c1e57" />
    <meta
      name="description"
      content="Evolution Hospital Limited provides specialist medical care, laboratory and diagnostic services, 24-hour emergency care and HMO-supported treatment."
    />
    <title>Evolution Hospital Limited | Specialist Care &amp; 24-Hour Emergency</title>
    <script>
      ;(function () {
        var root = document.documentElement
        var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches
        root.classList.add('splash-active')
        try {
          if (sessionStorage.getItem('ehl-splash-seen')) root.classList.add('splash-quick')
          sessionStorage.setItem('ehl-splash-seen', '1')
        } catch (error) {}
        window.__splashStart = performance.now()
        window.__splashQuick = root.classList.contains('splash-quick')
        window.__hideSplash = function () {
          var splash = document.getElementById('app-splash')
          if (!splash || splash.getAttribute('data-state') === 'leaving') return
          splash.setAttribute('data-state', 'leaving')
          splash.setAttribute('aria-hidden', 'true')
          root.classList.remove('splash-active')
          window.setTimeout(function () {
            if (splash.parentNode) splash.parentNode.removeChild(splash)
          }, reduceMotion ? 0 : 700)
        }
        window.setTimeout(window.__hideSplash, 8000)
      })()
    </script>
    <style>
      html.splash-active,
      html.splash-active body {
        overflow: hidden;
      }
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        display: grid;
        place-items: center;
        background:
          radial-gradient(60rem 40rem at 85% -10%, rgba(251, 221, 224, 0.55), transparent 60%),
          radial-gradient(50rem 40rem at 0% 110%, rgba(186, 201, 239, 0.55), transparent 60%),
          linear-gradient(180deg, #eef2fb 0%, #f7f8fb 100%);
        transition:
          opacity 0.6s cubic-bezier(0.22, 1, 0.36, 1),
          visibility 0.6s;
      }
      #app-splash[data-state='leaving'] {
        opacity: 0;
        visibility: hidden;
      }
      #app-splash[data-state='leaving'] .splash-content {
        transform: scale(1.04);
      }
      .splash-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1);
      }
      .splash-tile {
        position: relative;
        display: grid;
        place-items: center;
        width: 7.5rem;
        height: 7.5rem;
        border-radius: 2rem;
        background: #fff;
        box-shadow:
          0 1px 2px rgba(12, 23, 57, 0.05),
          0 24px 60px -24px rgba(12, 23, 57, 0.35);
        animation: splash-tile-in 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      .splash-ring {
        position: absolute;
        inset: 0;
        border-radius: inherit;
        border: 2px solid rgba(232, 17, 38, 0.35);
        animation: splash-ring 1.8s cubic-bezier(0.22, 1, 0.36, 1) 0.9s infinite;
        opacity: 0;
      }
      .splash-logo {
        width: 4.75rem;
        height: auto;
        overflow: visible;
      }
      .splash-logo .ghost {
        fill: #e81126;
        opacity: 0.12;
      }
      .splash-logo .fill {
        fill: #e81126;
      }
      .splash-logo .wipe {
        transform-box: fill-box;
        transform-origin: left center;
        animation: splash-wipe 0.95s cubic-bezier(0.65, 0, 0.35, 1) 0.25s both;
      }
      .splash-name {
        margin: 1.75rem 0 0;
        font-family: 'Fraunces', Georgia, 'Times New Roman', serif;
        font-size: 1.75rem;
        font-weight: 600;
        letter-spacing: -0.01em;
        line-height: 1;
        color: #0c1739;
        animation: splash-rise 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.55s both;
      }
      .splash-descriptor {
        margin: 0.5rem 0 0;
        font-family: 'Geist', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: #0f2d8f;
        animation: splash-rise 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.65s both;
      }
      .splash-bar {
        position: relative;
        width: 9rem;
        height: 3px;
        margin-top: 2rem;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(15, 45, 143, 0.12);
        animation: splash-rise 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.75s both;
      }
      .splash-bar::after {
        content: '';
        position: absolute;
        inset: 0;
        width: 40%;
        border-radius: inherit;
        background: linear-gradient(90deg, #0f2d8f, #3659bd);
        animation: splash-progress 1.2s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }
      .splash-label {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }
      .splash-quick .splash-tile,
      .splash-quick .splash-name,
      .splash-quick .splash-descriptor,
      .splash-quick .splash-bar {
        animation-duration: 0.3s;
        animation-delay: 0s;
      }
      .splash-quick .splash-logo .wipe {
        animation-duration: 0.45s;
        animation-delay: 0s;
      }
      @keyframes splash-tile-in {
        from {
          opacity: 0;
          transform: translateY(10px) scale(0.94);
        }
      }
      @keyframes splash-wipe {
        from {
          transform: scaleX(0);
        }
        to {
          transform: scaleX(1);
        }
      }
      @keyframes splash-ring {
        0% {
          opacity: 0.9;
          transform: scale(1);
        }
        100% {
          opacity: 0;
          transform: scale(1.35);
        }
      }
      @keyframes splash-rise {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
      }
      @keyframes splash-progress {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(250%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-splash,
        .splash-content {
          transition: none;
        }
        .splash-tile,
        .splash-name,
        .splash-descriptor,
        .splash-bar,
        .splash-logo .wipe,
        .splash-ring,
        .splash-bar::after {
          animation: none;
        }
        .splash-bar::after {
          width: 100%;
          opacity: 0.35;
        }
      }
    </style>
    <noscript>
      <style>
        #app-splash {
          display: none;
        }
        html.splash-active,
        html.splash-active body {
          overflow: auto;
        }
      </style>
    </noscript>
